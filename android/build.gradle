buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// [rn-template] Build every native module with the app's NDK. Libraries that don't read ndkVersion
// (react-native-unistyles today) would otherwise pull in AGP's default NDK as a second download.
// See docs/native-changes.md#ndk.
subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        subproject.android.ndkVersion = rootProject.ext.ndkVersion
    }
}
