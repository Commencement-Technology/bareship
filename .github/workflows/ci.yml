# Checks run on every pull request and push to main. The slow native builds are opt-in (ADR 0014): a pull
# request labelled "native", a manual run (Actions → CI → Run workflow), or every push to main once the
# repository variable NATIVE_BUILDS is "true" (Settings → Secrets and variables → Actions → Variables).
name: CI

on:
  pull_request:
    # `labeled` so adding the "native" label to an open pull request starts the native builds.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer run on the same branch cancels the older one. A run started by an unrelated label gets its
  # own group, so it can't cancel a real one (it does nothing: the checks job skips it).
  group: ci-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'native' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Types, lint, tests, boundaries
    # Adding any other label to a pull request doesn't need a new run.
    if: github.event.action != 'labeled' || github.event.label.name == 'native'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint --max-warnings=0
      - run: pnpm format:check
      - run: pnpm depcruise
      - run: pnpm test --coverage --ci
      - name: Release bundles contain no mock backend
        run: scripts/ci/check-no-mocks-in-release.sh

  android:
    name: Android build (${{ matrix.variant }})
    needs: checks
    # Opt-in: see the top of this file.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.NATIVE_BUILDS == 'true') ||
      contains(github.event.pull_request.labels.*.name, 'native')
    runs-on: ubuntu-24.04
    # A cold build takes 30-50 minutes. Without a limit, a stuck build holds the runner for 6 hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Debug proves the flavor wiring; Release also bundles JS and runs R8.
        variant: [assembleDevDebug, assembleProdRelease]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: pnpm install --frozen-lockfile
      # The native C++ (Skia, Reanimated, Worklets, the app) needs more memory than a standard runner has
      # (8 GB on private repositories). Without swap the runner is killed mid-build, after up to an hour of
      # silence. /mnt is the runner's spare disk.
      - name: Add swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - name: Build
        working-directory: android
        # One ABI; at most two Gradle tasks (so two native builds) at once; Kotlin compiles inside Gradle
        # instead of a second JVM.
        run: >
          ./gradlew ${{ matrix.variant }} --no-daemon --max-workers=2
          -PreactNativeArchitectures=arm64-v8a
          -Pkotlin.compiler.execution.strategy=in-process
      - name: Check the build carries its own environment
        run: |
          case "${{ matrix.variant }}" in
            assembleDevDebug) scripts/ci/check-env.sh dev debug ;;
            assembleProdRelease) scripts/ci/check-env.sh prod release ;;
          esac
      - name: Check 16 KB page alignment (Play requirement)
        if: matrix.variant == 'assembleProdRelease'
        run: scripts/ci/check-16kb.sh android/app/build/outputs/apk/prod/release/*.apk

  ios:
    name: iOS build (Debug-Dev, simulator)
    needs: checks
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.NATIVE_BUILDS == 'true') ||
      contains(github.event.pull_request.labels.*.name, 'native')
    runs-on: macos-26
    timeout-minutes: 75
    env:
      LANG: en_US.UTF-8
      USE_CCACHE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
      - run: pnpm pods
      # The image's default Xcode. Local development uses Xcode 27; macos-26 has Xcode 26.x
      # (docs/version-matrix.md). Printed so a failure shows which one built.
      - run: xcodebuild -version
      - name: Build
        working-directory: ios
        run: |
          APP=$(node -p "require('../app.json').name")
          xcodebuild -workspace "$APP.xcworkspace" -scheme "$APP-Dev" -configuration Debug-Dev \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -50
